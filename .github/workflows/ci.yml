name: CI

# DIETA DE COSTOS (2026-07-11, pedido del dueño): docs no gastan minutos;
# push nuevo cancela runs viejos; el job Build (redundante en PRs — el job de
# lint ya compila como typecheck) corre solo en push a main. Cualquier agente:
# no relajar sin autorización del dueño — ver "Costos CI/CD" en CLAUDE.md.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify seguridad (RLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Sondas VIVAS con la anon key: anon jamás debe leer PII del hogar ni
      # escribir. Skip limpio sin secrets; con secrets, cualquier fuga rompe.
      - name: Invariantes RLS (sondas anon)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/verify-rls-invariants.mjs

  migrations-lint:
    name: Lint de migraciones nuevas (Squawk)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Squawk sobre migraciones nuevas
        run: npm run db:lint

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate real: la deuda de no-explicit-any se limpió (2026-07-08).
      # Los 178 warnings restantes son no-unused-vars y no rompen el lint.
      - name: Run linter
        run: npm run lint

      - name: Run build (includes type checking)
        run: npm run build

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  build:
    name: Build
    # Solo en push a main: el job de lint ya compila (typecheck) en PRs.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
